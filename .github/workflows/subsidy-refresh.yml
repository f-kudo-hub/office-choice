# 補助金カレンダーの更新（月額会員 ¥2,980 の中身）
#
# 毎朝、デジタル庁「Jグランツ」の公開APIから受付中の補助金を取り直し、
# 締切カレンダーを作り直してコミットします。
#
# **APIキーは要りません。**認証なしで読める公開APIなので、
# 毎週の記事投稿と違って秘密の設定は不要です。
#
# なぜ毎日か：締切は日ごとに減ります。「7日以内に締切」を売りにする以上、
# 週1回だと最大6日ぶん古い数字を会員に見せることになります。
#
# ⚠️ 識別子は英字にしてあります。inputs 等に日本語を使うと
#    GitHubがワークフロー全体を読めなくなります（2026-08-31 に実害あり）。
#
# 手で試すとき：Actions タブ → 補助金カレンダーの更新 → Run workflow

name: 補助金カレンダーの更新

on:
  schedule:
    # UTC 21:00 ＝ 日本時間 翌朝6:00
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subsidy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 作業場を取り出す
        uses: actions/checkout@v4

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 補助金を集め直す
        run: node tools/補助金を集める.mjs

      # 1件ずつの中身（用途・補助率・対象業種）を取る。公開ページの土台。
      # **一覧のAPIだけでは、1件ぶんのページを作れる材料が無い。**
      - name: 補助金の中身を取り直す
        run: node tools/補助金の詳細を集める.mjs

      - name: 会員向けの原稿を作り直す
        run: node tools/会員向けの原稿を作る.mjs

      # 補助金1件につき1ページを作り直す（残り日数が毎日変わるので、毎朝作り直す）。
      # 受付の終わったものは、ページを消さずに「終了しました」へ変える。
      - name: サイトを組み立て直す
        run: node tools/サイトを組み立てる.mjs

      - name: 変わっていたらコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add データ/ 会員向け/ docs/
          # 中身が同じ日は何もしない（空コミットを積み上げない）
          if git diff --staged --quiet; then
            echo "変わりなし。コミットしません"
          else
            git commit -m "補助金カレンダーの更新：$(TZ=Asia/Tokyo date +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "送信に失敗。${i}回目の待機。"; sleep $((2 ** i))
            done
            exit 1
          fi

      # **公開してから知らせる。**先に知らせても、検索側が見に来たときページが無い。
      # 送るのは新しくできたページだけ（残り日数が減っただけのページは送らない）。
      # **失敗しても更新は取り消さない。**知らせの失敗で、その日の更新をなかったことにしない。
      - name: 検索エンジンに知らせる（IndexNow）
        continue-on-error: true
        run: node tools/検索エンジンに知らせる.mjs
